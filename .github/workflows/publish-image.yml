# Lints and tests every pull request, and on a version tag also builds the
# container image and pushes it to GitHub Container Registry.
#
# Publishing is triggered by pushing a version tag (make release VERSION=v0.2.0)
# or by dispatching an existing tag manually; a pull request only ever runs the
# checks. The repository can stay private: the package inherits the repository's
# visibility, and TrueNAS pulls it with a read-only token.
name: CI and publish

on:
  pull_request:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Existing version tag to (re)publish, e.g. v0.2.0"
        required: true
        type: string

# The publish job adds packages: write for itself, so pull request runs hold a
# read-only token.
permissions:
  contents: read

concurrency:
  group: ci-${{ inputs.ref || github.ref }}
  # Superseded pull request runs are wasted work; a release run is never cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: healthiam
          POSTGRES_USER: healthiam
          POSTGRES_PASSWORD: healthiam
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U healthiam -d healthiam"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Empty on a tag push or pull request, which checks out whatever
          # triggered the run; set only when republishing a tag by hand.
          ref: ${{ inputs.ref }}

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          uv venv .venv --python 3.12
          uv pip install --python .venv/bin/python -r pyproject.toml --extra dev

      - name: Lint
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .

      - name: Test
        env:
          DATABASE_URL: postgres://healthiam:healthiam@127.0.0.1:5432/healthiam
          SECRET_KEY: ci-only-not-a-real-secret
        run: .venv/bin/python -m pytest

  publish:
    name: Build and push
    needs: test
    # Never on a pull request: a PR must not be able to publish an image.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Empty on a tag push or pull request, which checks out whatever
          # triggered the run; set only when republishing a tag by hand.
          ref: ${{ inputs.ref }}

      - name: Resolve version and image name
        id: meta
        env:
          RAW_REF: ${{ inputs.ref || github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          case "$RAW_REF" in
            v[0-9]*) ;;
            *) echo "::error::Expected a version tag like v1.2.3, got '$RAW_REF'"; exit 1 ;;
          esac
          {
            echo "version=${RAW_REF#v}"
            echo "image=ghcr.io/$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          {
            echo "### Published"
            echo
            echo "    $IMAGE:$VERSION"
            echo
            echo "Update the TrueNAS app to this tag, then Save to redeploy."
          } >> "$GITHUB_STEP_SUMMARY"
