# Lints, tests and builds the image on every pull request, and on a version tag
# also pushes that image to GitHub Container Registry.
#
# Publishing is triggered by pushing a version tag (make release VERSION=0.2.0)
# or by dispatching an existing tag manually; a pull request only ever runs the
# checks. The repository can stay private: the package inherits the repository's
# visibility, and TrueNAS pulls it with a read-only token.
name: CI and publish

on:
  pull_request:
  push:
    tags:
      # Deliberately loose globs (these are glob, not regex): both the bare
      # 0.2.0 convention and v0.2.0. The version is validated properly below.
      - "[0-9]*"
      - "v[0-9]*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Existing version tag to (re)publish, e.g. 0.2.0"
        required: true
        type: string

# The publish job adds packages: write for itself, so pull request runs hold a
# read-only token.
permissions:
  contents: read

concurrency:
  group: ci-${{ inputs.ref || github.ref }}
  # Superseded pull request runs are wasted work; a release run is never cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: healthiam
          POSTGRES_USER: healthiam
          POSTGRES_PASSWORD: healthiam
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U healthiam -d healthiam"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Empty on a tag push or pull request, which checks out whatever
          # triggered the run; set only when republishing a tag by hand.
          ref: ${{ inputs.ref }}

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          uv venv .venv --python 3.12
          uv pip install --python .venv/bin/python -r pyproject.toml --extra dev

      - name: Lint
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .

      - name: Test
        env:
          DATABASE_URL: postgres://healthiam:healthiam@127.0.0.1:5432/healthiam
          SECRET_KEY: ci-only-not-a-real-secret
        run: .venv/bin/python -m pytest

  windows:
    name: Windows install path
    # The native Windows deployment (docs/deploy-windows.md) shares no code path with
    # the image, so nothing else here would notice it breaking: a dependency without a
    # Windows wheel, a missing tzdata, or a change that stops the proxy headers reaching
    # Django would all go unseen until somebody ran an install.
    #
    # Deliberately not in the publish job's `needs`. It is young; let it prove itself
    # before it can block a release.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Start PostgreSQL
        shell: pwsh
        run: |
          $svc = Get-Service -Name 'postgresql*' | Select-Object -First 1
          if (-not $svc) { throw 'No PostgreSQL service on the runner.' }
          Set-Service -Name $svc.Name -StartupType Manual
          Start-Service -Name $svc.Name
          $bin = (Get-ChildItem 'C:\Program Files\PostgreSQL\*\bin' | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          "$bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Create the database the way the installer does
        shell: pwsh
        env:
          PGPASSWORD: root
        run: |
          # TEMPLATE template0 is the point of this step: a default Windows cluster has a
          # locale like English_United States.1252 and refuses a UTF8 database copied from
          # template1. deploy/windows/Install-HealthIAM.ps1 issues this same statement.
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE healthiam LOGIN PASSWORD 'healthiam' SUPERUSER;"
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE healthiam OWNER healthiam ENCODING 'UTF8' TEMPLATE template0;"

      - name: Install dependencies with the windows extra
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[windows]" pytest pytest-django factory-boy

      - name: Windows-only dependencies resolve and work
        shell: pwsh
        run: |
          # Without tzdata this raises ZoneInfoNotFoundError on Windows and every request
          # that renders a timestamp fails.
          python -c "import zoneinfo; zoneinfo.ZoneInfo('America/Chicago'); print('tzdata ok')"
          python -c "import waitress, win32serviceutil; print('waitress and pywin32 ok')"

      - name: Test
        shell: pwsh
        env:
          DATABASE_URL: postgres://healthiam:healthiam@127.0.0.1:5432/healthiam
          SECRET_KEY: ci-only-not-a-real-secret
        run: python -m pytest

      - name: Serve with waitress and check the proxy headers reach Django
        shell: pwsh
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          DATABASE_URL: postgres://healthiam:healthiam@127.0.0.1:5432/healthiam
          SECRET_KEY: ci-only-not-a-real-secret
          ALLOWED_HOSTS: 127.0.0.1,localhost
          AUTH_LOCAL_LOGIN: "true"
          # Left on so the redirect itself is the probe: Django only skips it when it
          # believes the request arrived over HTTPS, which it can only learn from the
          # header IIS sets.
          SECURE_SSL_REDIRECT: "true"
        run: |
          python manage.py migrate --noinput
          python manage.py collectstatic --noinput

          # HttpClient rather than Invoke-WebRequest: Actions runs pwsh steps with
          # $ErrorActionPreference = 'stop', and Invoke-WebRequest raises on a redirect it
          # was told not to follow -- so the 301 this test wants to *assert* would fail the
          # step instead. HttpClient just returns the status.
          function Get-Status {
            param([hashtable]$Headers = @{})
            $handler = [System.Net.Http.HttpClientHandler]::new()
            $handler.AllowAutoRedirect = $false
            $client = [System.Net.Http.HttpClient]::new($handler)
            $client.Timeout = [TimeSpan]::FromSeconds(10)
            $request = [System.Net.Http.HttpRequestMessage]::new('GET', 'http://127.0.0.1:8000/login/')
            foreach ($key in $Headers.Keys) { $null = $request.Headers.TryAddWithoutValidation($key, $Headers[$key]) }
            try { [int]$client.SendAsync($request).GetAwaiter().GetResult().StatusCode }
            catch { 0 }
            finally { $client.Dispose() }
          }

          $server = Start-Process python -ArgumentList 'deploy\windows\serve.py' -PassThru -NoNewWindow
          try {
            $up = $false
            foreach ($attempt in 1..30) {
              if ((Get-Status) -ne 0) { $up = $true; break }
              Start-Sleep -Seconds 1
            }
            if (-not $up) { throw 'serve.py never answered on 127.0.0.1:8000.' }

            # SECURE_SSL_REDIRECT is on, so Django redirects anything it believes arrived
            # over plain HTTP. That makes the redirect itself the probe.
            $plain = Get-Status
            if ($plain -ne 301) { throw "Expected 301 without X-Forwarded-Proto, got $plain." }

            # The regression test that matters. waitress strips every X-Forwarded-* header
            # unless it is told which proxy to trust, which silently defeats the whole IIS
            # configuration: cookies stay Secure while Django believes the connection is
            # plain HTTP, and sign-in loops with no error anywhere.
            $proxied = Get-Status @{ 'X-Forwarded-Proto' = 'https' }
            if ($proxied -ne 200) {
              throw "X-Forwarded-Proto did not reach Django (got $proxied, expected 200). Check trusted_proxy in deploy/windows/serve.py."
            }
            Write-Host 'Proxy headers reach Django correctly.'
          } finally {
            if ($server -and -not $server.HasExited) { Stop-Process -Id $server.Id -Force }
          }

      - name: PowerShell scripts parse
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem deploy/windows -Filter *.ps1 | ForEach-Object {
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
            if ($errors) { $failed = $true; Write-Host "::error file=$($_.FullName)::$($errors[0].Message)" }
          }
          if ($failed) { exit 1 }
          Write-Host 'All deploy/windows scripts parse.'

  image:
    name: Build image
    # A pull request otherwise never builds the image, so a Dockerfile change
    # could only fail at release time. Runs alongside the checks rather than
    # after them; on a tag push the publish job below builds it anyway.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: Build and push
    needs: test
    # Never on a pull request: a PR must not be able to publish an image.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Empty on a tag push or pull request, which checks out whatever
          # triggered the run; set only when republishing a tag by hand.
          ref: ${{ inputs.ref }}

      - name: Resolve version and image name
        id: meta
        env:
          RAW_REF: ${{ inputs.ref || github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # Tags may be written either way; the image tag never carries the v.
          if ! printf '%s' "$RAW_REF" | grep -Eq '^v?[0-9]+(\.[0-9]+){1,2}([-.+][0-9A-Za-z.-]+)?$'; then
            echo "::error::Expected a version tag like 0.2.0 or v0.2.0, got '$RAW_REF'"
            exit 1
          fi
          {
            echo "version=${RAW_REF#v}"
            echo "image=ghcr.io/$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          {
            echo "### Published"
            echo
            echo "    $IMAGE:$VERSION"
            echo
            echo "Update the TrueNAS app to this tag, then Save to redeploy."
          } >> "$GITHUB_STEP_SUMMARY"
