services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: healthiam
      POSTGRES_USER: healthiam
      POSTGRES_PASSWORD: healthiam
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthiam -d healthiam"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://healthiam:healthiam@db:5432/healthiam
      DJANGO_SETTINGS_MODULE: config.settings.prod
      SECURE_SSL_REDIRECT: "false"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  pgdata:
