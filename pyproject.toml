[project]
name = "healthiam"
version = "0.1.0"
description = "Position-based access defaults and application catalog for healthcare IAM"
requires-python = ">=3.11"
dependencies = [
  "django>=5.2,<5.3",
  "psycopg[binary]>=3.2",
  "mozilla-django-oidc>=4.0",
  "django-auditlog>=3.0",
  "django-htmx>=1.19",
  "django-environ>=0.11",
  "whitenoise>=6.7",
  "gunicorn>=23",
  "openpyxl>=3.1",
  "ldap3>=2.9.1,<3",
  # The Entra ID sync's token acquisition (client credentials). 1.35 is the first release that
  # takes a PEM key with its certificate and works out the SHA-256 thumbprint Entra ID now
  # expects, so docs/entra-setup.md need not ask anyone for a thumbprint.
  "msal>=1.35,<2",
  # Windows ships no IANA time zone database, so zoneinfo cannot resolve TIME_ZONE and
  # every request raises ZoneInfoNotFoundError. A marker rather than a line in the
  # windows extra below, because this is needed by every Python process that touches the
  # app there -- the scheduled sync and any manage.py run, not only the service host.
  # The marker excludes it everywhere else, so the image is unaffected.
  "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-django>=4.9",
  "factory-boy>=3.3",
  "ruff>=0.6",
]
# Native Windows Server installs (docs/deploy-windows.md). Not needed anywhere else:
# the container and development both stay on the base list.
windows = [
  # gunicorn imports fcntl, so it cannot run on Windows. The wheel still installs
  # cleanly from the base list; it is simply never invoked there.
  "waitress>=3.0",
  # Hosts the WSGI server as a real Windows service, from PyPI rather than a
  # third-party binary that a locked-down network would have to whitelist.
  "pywin32>=306",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["migrations", ".venv", "staticfiles", "static/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
ignore = ["B904"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-q"
