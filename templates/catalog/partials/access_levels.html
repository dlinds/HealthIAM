{% load ui %}
<div id="access-levels">
  <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-2">
    <p class="text-body-secondary small mb-0">Access levels are the units positions receive by default. Each records how it is granted.</p>
    {% if can_edit_levels %}
    <button class="btn btn-sm btn-primary" type="button" hx-get="{% url 'catalog:access_level_add' application.pk %}?{% query_replace %}" hx-target="#access-level-form-slot" hx-swap="innerHTML">
      <i class="bi bi-plus-lg me-1"></i>Add level
    </button>
    {% endif %}
  </div>
  {% if show_level_filter %}
  <div class="mb-2" style="max-width: 24rem">
    <input class="form-control form-control-sm" type="search" name="levels_q" value="{{ levels_q }}"
           placeholder="Filter by name, AD group, team or description"
           autocomplete="off"
           hx-get="{% url 'catalog:access_levels' application.pk %}"
           hx-trigger="input changed delay:250ms, search"
           hx-target="#access-level-rows" hx-swap="outerHTML">
  </div>
  {% endif %}
  <div id="access-level-form-slot"></div>
  {% include "catalog/partials/access_level_rows.html" %}
</div>
