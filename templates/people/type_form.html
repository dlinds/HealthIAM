{% extends "base.html" %}
{% block title %}New people type · HealthIAM{% endblock %}
{% block content %}
<nav aria-label="breadcrumb"><ol class="breadcrumb">
  <li class="breadcrumb-item"><a href="{% url 'people:type_list' %}">People types</a></li>
  <li class="breadcrumb-item active">New</li>
</ol></nav>
<div class="row">
  <div class="col-lg-6">
    <div class="card">
      <div class="card-body">
        <h1 class="h4">New people type</h1>
        <form method="post">
          {% csrf_token %}
          {% include "partials/form_fields.html" with form=form %}
          <button class="btn btn-primary" type="submit">Save</button>
          <a class="btn btn-link" href="{% url 'people:type_list' %}">Cancel</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
