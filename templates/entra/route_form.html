{% extends "base.html" %}
{% block title %}Edit route · HealthIAM{% endblock %}
{% block content %}
<nav aria-label="breadcrumb"><ol class="breadcrumb">
  <li class="breadcrumb-item"><a href="{% url 'entra:admin_index' %}">Entra ID</a></li>
  <li class="breadcrumb-item"><a href="{% url 'entra:route_list' %}">Routes</a></li>
  <li class="breadcrumb-item active">{{ route.pattern }}</li>
</ol></nav>
<h1 class="h3 mb-3">Edit route</h1>
<div class="row"><div class="col-lg-6">
  <form method="post">
    {% csrf_token %}
    {% include "partials/form_fields.html" with form=form %}
    <button class="btn btn-primary" type="submit">Save</button>
    <a class="btn btn-outline-secondary" href="{% url 'entra:route_list' %}">Cancel</a>
  </form>
</div></div>
{% endblock %}
